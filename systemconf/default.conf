[ids]

*

[main]

# Maps capslock to escape when pressed and control when held.
capslock = overload(dia, esc)

# Remaps the escape key to capslock
esc = capslock

rightalt = layer(bonus)

[bonus]

e = macro(compose e =)

[dia]

; = macro(compose o ")
' = macro(compose a ")
[ = macro(compose a *)

[dia+shift]

; = macro(compose O ")
' = macro(compose A ")
[ = macro(compose A *)
